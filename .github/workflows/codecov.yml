name: CodeCov Test and coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.20'
      - name: Run coverage
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -tags=debugNflex
      - name: Upload coverage to Codecov
        run: env CODECOV_TOKEN=764eb126-04d6-46cf-a952-cb51766c8572 bash <(curl -s https://codecov.io/bash)
